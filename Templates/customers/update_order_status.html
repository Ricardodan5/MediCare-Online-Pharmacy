{% extends "base.html" %}

{% block title %}Update Order Status - Medicare{% endblock %}

{% block content %}
<section class="container">
    <h2>Update Medicine Order Status</h2>

    <p><strong>Medicine:</strong> {{ order.medicine_name }}</p>

    <p><strong>Order ID:</strong> {{ order.id }}</p>

    <p><strong>Current Status:</strong> {{ order.status }}</p>

    <form method="POST">
        {% csrf_token %}

        <label for="status">Select New Status:</label>

        <select name="status" id="status">
            {% for value, label in order.STATUS_CHOICES %}
                <option value="{{ value }}"
                    {% if order.status == value %}selected{% endif %}>
                    {{ label }}
                </option>
            {% endfor %}
        </select>

        <button type="submit">Update Status</button>
    </form>

    <a href="{% url 'my_orders' %}">Back to My Orders</a>
</section>
{% endblock %}
